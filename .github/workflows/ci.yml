name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and unit-test the agent, profiles and actions
        run: |
          go vet ./agent/... ./profiles/... ./actions/...
          go test ./agent/... ./profiles/... ./actions/...
      - name: Race detector over the agent (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./agent/... ./actions/...
      - name: Run every shipped scan profile on this runner (Linux/macOS, as root like the agent)
        if: runner.os != 'Windows'
        run: |
          go test -c -o executor.test ./agent/internal/executor
          sudo ARH_RUN_PROFILES=1 ./executor.test -test.run TestShippedProfilesRunHere -test.v -test.timeout 20m
      - name: Run every shipped scan profile on this runner (Windows, elevated runner)
        if: runner.os == 'Windows'
        env:
          ARH_RUN_PROFILES: '1'
        run: go test ./agent/internal/executor -run TestShippedProfilesRunHere -v -timeout 20m
      # Actions: every measure step (what a preview runs), then real apply and undo of the
      # actions that are safe on a throwaway runner, checked against the measured values.
      - name: Measure, apply and undo the shipped actions (Linux/macOS, as root like the agent)
        if: runner.os != 'Windows'
        run: |
          go test -c -o link.test ./agent/internal/link
          sudo ARH_LIVE_ACTIONS=1 ./link.test -test.run TestShippedActionsMeasureHere -test.v -test.timeout 10m
          sudo ARH_LIVE_APPLY=1 ./link.test -test.run TestShippedActionsApplyHere -test.v -test.timeout 10m
      # (go test, not the compiled binary: PowerShell splits "-test.v" at the dot)
      - name: Measure the shipped actions (Windows, elevated runner)
        if: runner.os == 'Windows'
        env:
          ARH_LIVE_ACTIONS: '1'
        run: go test ./agent/internal/link -run TestShippedActionsMeasureHere -v -count=1 -timeout 10m
      # Each run is measure, apply and measure again; the whole step took 6 to 11 minutes on
      # hosted runners, and the log shows each phase's time.
      - name: Apply and undo the shipped actions (Windows, elevated runner)
        if: runner.os == 'Windows'
        env:
          ARH_LIVE_APPLY: '1'
        run: go test ./agent/internal/link -run TestShippedActionsApplyHere -v -count=1 -timeout 30m
      - name: Busiest processes after the live action tests (Windows)
        if: always() && runner.os == 'Windows'
        run: Get-Process | Sort-Object CPU -Descending | Select-Object -First 15 Name, Id, CPU, StartTime | Format-Table -AutoSize

  host:
    name: dashboard (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm install --no-audit --no-fund
      - name: npm audit (report only)
        run: node scripts/audit-summary.mjs
      # "Error: Electron uninstall": the npm package is there but its program was never
      # downloaded. Break it on purpose and check that the pre-dev script repairs it.
      - name: Electron self-repair before npm run dev
        shell: pwsh
        run: |
          node scripts/ensure-electron.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ensure-electron failed on a good install' }
          Remove-Item node_modules/electron/path.txt
          Remove-Item -Recurse -Force node_modules/electron/dist
          node scripts/ensure-electron.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ensure-electron did not repair a missing Electron program' }
          if (-not (Test-Path node_modules/electron/path.txt)) { throw 'path.txt is still missing' }
          $exe = Get-Content node_modules/electron/path.txt
          if (-not (Test-Path (Join-Path node_modules/electron/dist $exe))) { throw "missing $exe after the repair" }
      - name: Build the agent for every target
        run: npm run agent:build
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Verify the WMI/CIM classes and event subscriptions on this Windows build
        run: npm run verify-wmi
      - name: Inspect-Vault.ps1 smoke test (read-only, against the synthetic fixture)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'arh-vault-report.md'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Inspect-Vault.ps1 -VaultPath 'tests/fixtures/vault/ARH IT' -OutFile $out
          $report = Get-Content $out -Raw -Encoding utf8
          foreach ($needle in 'ARH IT Hub.md', 'ARH Open Loops.md', 'Tasks plugin due', 'obsidian-tasks-plugin') {
            if (-not $report.Contains($needle)) { throw "report is missing '$needle'" }
          }
          $dirty = git status --porcelain -- tests/fixtures
          if ($dirty) { throw "Inspect-Vault.ps1 modified the fixture: $dirty" }
          Get-Content $out -TotalCount 60
      # Separate steps: a failed build must fail the job, not fall through to packaging.
      - name: Build (main, preload, renderer)
        run: npm run build
      - name: Check the build output
        shell: pwsh
        run: |
          foreach ($f in 'out/main/index.js', 'out/preload/index.js', 'out/renderer/index.html') {
            if (-not (Test-Path $f)) { throw "missing $f after the build" }
          }
      - name: Package (NSIS installer with bundled agents and profiles)
        run: npx electron-builder --win --publish never
      - name: Check the package contents
        shell: pwsh
        run: |
          $res = 'dist/win-unpacked/resources'
          foreach ($f in 'agent/arh-agent-windows-amd64.exe', 'agent/arh-agent-darwin-arm64', 'agent/arh-agent-linux-amd64', 'profiles/windows-system-diagnostics.json', 'actions/windows-dns-flush.json') {
            if (-not (Test-Path (Join-Path $res $f))) { throw "missing $f in the package" }
          }
          Get-ChildItem dist -Filter *.exe | Format-Table Name, Length
      # Launch the packaged app and drive its window: lookup box, a computer page, every tab.
      # It reads a COPY of the synthetic vault fixture and exits non-zero on a crash,
      # a renderer console error or anything missing from the page (src/main/smoke.ts).
      - name: Launch test of the packaged app
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'arh-smoke'
          $vault = Join-Path $dir 'vault'
          New-Item -ItemType Directory -Force -Path $vault | Out-Null
          Copy-Item -Recurse 'tests/fixtures/vault/ARH IT' $vault
          $settings = @{ vaultPath = (Join-Path $vault 'ARH IT'); technician = 'CI' } | ConvertTo-Json
          Set-Content -Path (Join-Path $dir 'settings.json') -Value $settings -Encoding utf8
          $env:ARH_SMOKE = '1'
          $env:ARH_SMOKE_DIR = $dir
          $exe = Get-ChildItem 'dist/win-unpacked' -Filter '*.exe' | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          $log = Join-Path $dir 'smoke.log'
          $p = Start-Process -FilePath $exe.FullName -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError (Join-Path $dir 'smoke.err')
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw 'the app did not finish the launch test in 150 s' }
          Get-Content $log
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $dir 'smoke.err') -Tail 40; throw "launch test failed (exit $($p.ExitCode))" }
          $dirty = git status --porcelain -- tests/fixtures
          if ($dirty) { throw "the launch test modified the fixture: $dirty" }
      - uses: actions/upload-artifact@v4
        with:
          name: ARH-IT-Dashboard-setup
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: arh-agent-binaries
          path: agent/dist/arh-agent-*
          if-no-files-found: error
