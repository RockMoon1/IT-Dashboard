appId: com.arh.itdashboard
productName: ARH IT Dashboard
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # Agent binaries for every target OS, so the technician can copy the right one to a device.
  - from: agent/dist
    to: agent
    filter:
      - arh-agent-*
  # Scan profiles, read-only data shared with the agent build.
  - from: profiles
    to: profiles
    filter:
      - '*.json'
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
